services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ml/data:/app/ml/data
      - ./ml/saved_models:/app/ml/saved_models
    networks:
      - relearn-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - relearn-net

networks:
  relearn-net:
    driver: bridge
